# Config for the Discord listener in ../discord_mcp (listen.py). Start it with
# `make discord-listen`. Copy this file to discord-listener.toml (gitignored)
# and fill in allow_users. The bot token is not here: it comes from
# ../discord_mcp/.env (DISCORD_TOKEN, and DISCORD_CHANNELS for the names below).
# Reference: ../discord_mcp/README.md, section "The listener".

channels = ["myhordes"]                  # #myhordes-ai
allow_users = ["YOUR_DISCORD_USER_ID"]   # who may talk to the bot
poll_seconds = 20
backlog_minutes = 30
settle_seconds = 8

# A session idle for 55+ minutes (the prompt cache lives 1 hour) whose last model call
# held 128000+ tokens is not resumed: the bot posts a fixed notice instead of paying to
# rewrite that context. Counters live in a state file outside cwd (the bot writes in
# towns/), default ~/.local/state/discord-listener/<bot id>.json.
[sessions]
idle_minutes = 55
max_resume_tokens = 128000      # 0 switches the rule off
# state_file = "~/.local/state/discord-listener/state.json"

# DMs from allow_users (needs listed ids, not "*"). The first DM gets the disclaimer;
# the person consents by adding a check mark themselves, the bot never adds one.
# Remove it and the bot goes silent. `new` starts a fresh DM session.
[dm]
enabled = false
disclaimer_file = "prompts/discord-dm-disclaimer.md"
maintainer = "YOUR_DISCORD_USER_ID"    # replaces {maintainer} in the text with a mention
# A DM has no new thread to go to: a session the [sessions] rule cuts restarts by itself,
# carrying this much of the latest talk (estimated tokens; 0 = none).
carry_tokens = 4000

# Slash commands: run by the listener itself, without Claude (no tokens, no prompt
# injection). Only allow_users may use them. The listener registers them at start and
# listens for them over a gateway connection (needs the applications.commands scope on
# the server and no Interactions Endpoint URL in the Developer Portal).
# Details: ../discord_mcp/README.md ("Slash commands"), docs/discord.md ("Slash commands").
[[commands]]
name = "help"
description = "What the bot can do, with examples"
reply_file = "prompts/discord-help.md"     # inside claude.cwd, at most 2000 characters
# ephemeral = true                         # default: only the person who asked sees the answer

[[commands]]
name = "set-my-town"
description = "Set your default town"
# {user} is the Discord id of whoever runs the command, {town} the option's value.
# A placeholder must be a whole element. No shell is involved.
argv = ["python3", "scripts/set_town.py", "--user", "{user}", "{town}"]
timeout_seconds = 10                       # default 10, maximum 60

[[commands.options]]
name = "town"
description = "Fata Morgana town ID"
type = "integer"                           # "integer" | "string"
required = true                            # a required option is focused right after the command
min_value = 1
max_value = 9999999

[limits]
max_turns_per_user_per_hour = 60
max_turns_per_hour = 60

[claude]
cwd = "."
model = "sonnet"
# Add "prompts/discord-feedback.md" to log feedback in towns/_bot/feedback/ for
# /review-bot-feedback (docs/discord.md, "Memory and feedback log").
append_system_prompt_files = ["persona.md", "prompts/game-primer.md", "prompts/discord.md"]
# Pasted into the first prompt of each thread (bot memory, prompts/discord.md).
first_turn_files = ["towns/_bot/memory.md"]
mcp_config = ["discord-listener.mcp.json"]   # copy from discord-listener.mcp.example.json
# Read-only game and wiki tools, by name. Never mcp__myhordes__*.
allowed_tools = [
  "mcp__myhordes__get_bank_inventory",
  "mcp__myhordes__get_town_overview",
  "mcp__myhordes__get_citizen_positions",
  "mcp__myhordes__get_citizen_cp",
  "mcp__myhordes__get_defense_status",
  "mcp__myhordes__get_buildings",
  "mcp__myhordes__get_build_options",
  "mcp__myhordes__get_blueprint_order",
  "mcp__myhordes__get_construction_history",
  "mcp__myhordes__get_town_changes",
  "mcp__myhordes__get_night_report",
  "mcp__myhordes__get_expedition_roster",
  "mcp__myhordes__get_scout_map",
  "mcp__myhordes__find_expedition_path",
  "mcp__myhordes__plan_expedition_supplies",
  "mcp__myhordes__get_zone_details",
  "mcp__myhordes__get_attack_distribution",
  "mcp__myhordes__get_attack_forecast",
  "mcp__myhordes__search_wiki",
  "mcp__myhordes__list_wiki_categories",
  "mcp__myhordes__search_knowledge",
  # inspect-town and close-day write the town logs. Writes stay in towns/.
  "Write(./towns/**)",
  "Edit(./towns/**)",
]
# personal/ holds private notes on other players; answers are public. The shared
# default town is changed only from the terminal (deny wins over the towns/** allow).
deny = [
  "Read(./personal/**)",
  "Write(./towns/_current_town)",
  "Edit(./towns/_current_town)",
]
# Lifts the baseline deny on writes so the allows above can apply. Acceptable for a
# few trusted users, given the Write/Edit allows cover only ./towns/** (memory, the
# bot's feedback log, per-user default towns); revisit before opening allow_users.
unsafe_allow = ["Write", "Edit"]
timeout_seconds = 600
max_budget_usd = 100   # the maximum: on the subscription this is an equivalent, not a charge
