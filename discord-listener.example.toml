# Config for the Discord listener in ../discord_mcp (listen.py). Start it with
# `make discord-listen`. Copy this file to discord-listener.toml (gitignored)
# and fill in allow_users. The bot token is not here: it comes from
# ../discord_mcp/.env (DISCORD_TOKEN, and DISCORD_CHANNELS for the names below).
# Reference: ../discord_mcp/README.md, section "The listener".

channels = ["myhordes"]                  # #myhordes-ai
allow_users = ["YOUR_DISCORD_USER_ID"]   # who may talk to the bot
poll_seconds = 20
backlog_minutes = 30
settle_seconds = 8

[limits]
max_turns_per_user_per_hour = 60
max_turns_per_hour = 60

[claude]
cwd = "."
model = "sonnet"
# Add "prompts/discord-feedback.md" to log feedback in towns/_bot/feedback/ for
# /review-bot-feedback (docs/discord.md, "Memory and feedback log").
append_system_prompt_files = ["persona.md", "prompts/game-primer.md", "prompts/discord.md"]
# Pasted into the first prompt of each thread (bot memory, prompts/discord.md).
first_turn_files = ["towns/_bot/memory.md"]
mcp_config = ["discord-listener.mcp.json"]   # copy from discord-listener.mcp.example.json
# Read-only game and wiki tools, by name. Never mcp__myhordes__*.
allowed_tools = [
  "mcp__myhordes__get_bank_inventory",
  "mcp__myhordes__get_town_overview",
  "mcp__myhordes__get_citizen_positions",
  "mcp__myhordes__get_citizen_cp",
  "mcp__myhordes__get_defense_status",
  "mcp__myhordes__get_buildings",
  "mcp__myhordes__get_build_options",
  "mcp__myhordes__get_construction_history",
  "mcp__myhordes__get_town_changes",
  "mcp__myhordes__get_night_report",
  "mcp__myhordes__get_expedition_roster",
  "mcp__myhordes__get_scout_map",
  "mcp__myhordes__find_expedition_path",
  "mcp__myhordes__plan_expedition_supplies",
  "mcp__myhordes__get_zone_details",
  "mcp__myhordes__get_attack_distribution",
  "mcp__myhordes__get_attack_forecast",
  "mcp__myhordes__search_wiki",
  "mcp__myhordes__list_wiki_categories",
  "mcp__myhordes__search_knowledge",
  # inspect-town and close-day write the town logs. Writes stay in towns/.
  "Write(./towns/**)",
  "Edit(./towns/**)",
]
# personal/ holds private notes on other players; answers are public.
deny = ["Read(./personal/**)"]
# Lifts the baseline deny on writes so the allows above can apply. Acceptable while
# a single trusted user is allowed; revisit before opening allow_users.
unsafe_allow = ["Write", "Edit"]
timeout_seconds = 600
max_budget_usd = 100   # the maximum: on the subscription this is an equivalent, not a charge
